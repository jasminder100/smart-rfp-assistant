services:
  api:
    build: .
    image: rfp-assistant:latest
    env_file: .env
    volumes:
      - ./chroma_db:/app/chroma_db      # the vector database survives restarts
      - ./data:/app/data                # uploaded documents survive restarts
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ui:
    build: .
    image: rfp-assistant:latest
    command:
      - streamlit
      - run
      - ui/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      API_URL: http://api:8000          # reach the API by its service name
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy      # wait until /health says ok
    restart: unless-stopped
