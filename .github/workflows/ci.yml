name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # lets you press "Run workflow" by hand

permissions:
  contents: read            # the pipeline can read the repo and nothing else

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true  # a newer push cancels the older run

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Docker build and health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t rfp-api:ci .

      - name: Start the API container
        run: docker run -d --name rfp-api -p 8000:8000 rfp-api:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          docker logs rfp-api
          exit 1

      - name: Show logs if something failed
        if: failure()
        run: docker logs rfp-api